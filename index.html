
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muxtorch - Delivery Service</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header>
        <div class="navbar">
            <img src="logo.png" alt="Muxtorch Logo" class="logo">
            <nav>
                <ul>
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>Welcome to Muxtorch</h1>
            <p>Your trusted delivery and logistics partner.</p>
            <button class="cta-button" id="open-form">Book a Delivery</button>
        </section>
    </main>

    <!-- Popup Form -->
    <div id="popup-form" class="popup-form">
        <div class="form-container">
            <span id="close-form" class="close">&times;</span>
            <h2>Book a Delivery</h2>
            <form id="delivery-form" method="POST" enctype="multipart/form-data">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="location">Location</label>
                <input type="text" id="country" name="country" placeholder="Country" required>
                <input type="text" id="city" name="city" placeholder="City" required>
                <textarea id="address" name="address" placeholder="Precise Location" required></textarea>

                <label for="item">What do you want to deliver?</label>
                <textarea id="item" name="item" placeholder="Description of the item" required></textarea>

                <label for="photo">Upload Photo (Optional)</label>
                <input type="file" id="photo" name="photo">

                <button type="submit" class="cta-button">Submit</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Muxtorch. All rights reserved.</p>
    </footer>
</body>
</html>
